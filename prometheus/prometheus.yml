global:
  scrape_interval: 5s        # scrape every 5s so experiments show up quickly
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'generator-app'
    static_configs:
      - targets: ['app:3000']        # 'app' = the compose service name

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
      
  - job_name: 'grpc-generator'
    static_configs:
      - targets: ['host.docker.internal:9091']
