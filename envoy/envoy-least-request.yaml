# Envoy for A3 - Part A: all traffic goes to replica A only.
# Part C adds app-2 and app-3 to both clusters.

admin:                                   # Envoy's own metrics: :9901/stats/prometheus
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:

  # ---------- HTTP in: localhost:8080 ----------
  - name: http_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: http_in
          codec_type: AUTO
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  "@timestamp": "%START_TIME%"
                  app_name: "envoy"
                  interface: "http"
                  trace_id: "%REQ(TRACE-ID)%"
                  method: "%REQ(:METHOD)%"
                  path: "%REQ(:PATH)%"
                  status: "%RESPONSE_CODE%"
                  duration_ms: "%DURATION%"
                  upstream_host: "%UPSTREAM_HOST%"      # which replica was picked
                  upstream_cluster: "%UPSTREAM_CLUSTER%"
          route_config:
            virtual_hosts:
            - name: app_http
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: app_http }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # ---------- gRPC in: localhost:8081 ----------
  # Proxied as HTTP/2 (not plain TCP), so Envoy sees each call separately.
  - name: grpc_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8081 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: grpc_in
          codec_type: AUTO
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  "@timestamp": "%START_TIME%"
                  app_name: "envoy"
                  interface: "grpc"
                  trace_id: "%REQ(TRACE-ID)%"
                  method: "%REQ(:METHOD)%"
                  path: "%REQ(:PATH)%"
                  status: "%RESPONSE_CODE%"
                  grpc_status: "%GRPC_STATUS%"
                  duration_ms: "%DURATION%"
                  upstream_host: "%UPSTREAM_HOST%"
                  upstream_cluster: "%UPSTREAM_CLUSTER%"
          route_config:
            virtual_hosts:
            - name: app_grpc
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: app_grpc }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:

  # ---------- HTTP replicas (Part A: only A) ----------
  - name: app_http
    health_checks:
    - timeout: 1s
      interval: 2s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check: { path: /health }
    type: STRICT_DNS
    lb_policy: LEAST_REQUEST
    load_assignment:
      cluster_name: app_http
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: esd_first_assignment-app-1, port_value: 3000 } } }
        - endpoint: { address: { socket_address: { address: esd_first_assignment-app-2, port_value: 3000 } } }
        - endpoint: { address: { socket_address: { address: esd_first_assignment-app-3, port_value: 3000 } } }

  # ---------- gRPC replicas (Part A: only A) ----------
  - name: app_grpc
    health_checks:
    - timeout: 1s
      interval: 2s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check: { path: /health, codec_client_type: HTTP1 }
    type: STRICT_DNS
    lb_policy: LEAST_REQUEST
    typed_extension_protocol_options:        # talk HTTP/2 to the replicas (gRPC needs it)
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: app_grpc
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: esd_first_assignment-app-1, port_value: 50051 } }, health_check_config: { port_value: 3000 } }
        - endpoint: { address: { socket_address: { address: esd_first_assignment-app-2, port_value: 50051 } }, health_check_config: { port_value: 3000 } }
        - endpoint: { address: { socket_address: { address: esd_first_assignment-app-3, port_value: 50051 } }, health_check_config: { port_value: 3000 } }